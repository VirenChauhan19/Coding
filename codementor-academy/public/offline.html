<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · CodeMentor Academy</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #eef2ff;
        display: grid; place-items: center; min-height: 100vh; color: #1e293b; }
      .card { text-align: center; padding: 2rem; }
      .emoji { font-size: 3rem; }
      h1 { margin: 0.5rem 0; }
      p { color: #64748b; }
      button { margin-top: 1rem; padding: 0.6rem 1.4rem; border: 0; border-radius: 0.75rem;
        background: #4f46e5; color: white; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">📡</div>
      <h1>You're offline</h1>
      <p>CodeMentor needs a connection to load this page.<br />Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
